<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#4a0822" />
<meta name="description" content="Pre-order Maharaj samosas for Navratri — fill your thali, pick your night, get your Navratri Pass." />
<meta property="og:title" content="Maharaj Navratri Special — Get your Navratri Pass" />
<meta property="og:description" content="Navtad, Chinese, Cheese Corn, Pizza Samosa & more. Pre-order by the dozen for your garba nights." />
<meta property="og:image" content="logo.png" />
<link rel="icon" type="image/png" href="icon-192.png" />
<title>Maharaj Navratri Pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@500;600;700;800&family=Yatra+One&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="config.js"></script>
<script src="festive.js"></script>
<style>
:root {
  --maroon: #6d0f33; --maroon-2: #4a0822; --maroon-3: #2a0413; --magenta: #c2185b; --pink: #e91e63; --saffron: #e8491d; --marigold: #f6a400; --gold: #ffc93c; --gold-2: #ffe08a;
  --cream: #fff7ea; --card: #fffdf8; --ink: #2b1310; --ink-2: #6f5a52; --ink-3: #ad9a90; --line: #f0e1cf; --field-line: #e6d2bb; --green: #0f9d6b; --red: #d32f2f;
  --display: "Baloo Bhai 2", "Inter", system-ui, sans-serif;
  --fest: "Yatra One", "Baloo Bhai 2", serif;
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Gujarati", sans-serif;
  color: var(--ink); -webkit-tap-highlight-color: transparent;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100dvh; }
body { color: #fff; overflow-x: hidden; background:
  radial-gradient(circle at 50% 30%, rgba(255,201,60,.22), transparent 45%),
  radial-gradient(130% 100% at 50% 0%, #a3154a 0%, var(--maroon) 40%, var(--maroon-2) 75%, var(--maroon-3) 100%) fixed; }
body::before { content: ''; position: fixed; inset: 0; z-index: -1; opacity: .2; pointer-events: none;
  background: radial-gradient(circle, #ffc93c 1.3px, transparent 1.8px) 0 0 / 22px 22px, radial-gradient(circle, #fff 1px, transparent 1.5px) 11px 11px / 22px 22px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-user-select: none; user-select: none; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--display); margin: 0; }
.hidden { display: none !important; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
@keyframes bell { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
@keyframes inR { from { opacity: 0; transform: translateX(40px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes inL { from { opacity: 0; transform: translateX(-40px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(0) rotate(-30deg); } 70% { transform: scale(1.25) rotate(8deg); } 100% { transform: scale(1) rotate(var(--r, 0deg)); } }
@keyframes flicker { 0%,100% { transform: scale(1) rotate(-2deg); } 50% { transform: scale(.88) rotate(2deg) translateY(1px); } }
@keyframes glow { 0%,100% { box-shadow: 0 0 0 4px var(--gold), 0 0 0 4px rgba(255,201,60,.6); } 50% { box-shadow: 0 0 0 4px var(--gold), 0 0 0 14px rgba(255,201,60,0); } }
@keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--rot)); } }
@keyframes twinkle { 0%,100% { opacity: .2; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
@keyframes shine { from { background-position: -200% 0; } to { background-position: 200% 0; } }
@keyframes float { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-70vh); opacity: 0; } }
@keyframes stampIn { 0% { transform: scale(2.4) rotate(-18deg); opacity: 0; } 100% { transform: scale(1) rotate(-12deg); opacity: .9; } }

/* ═════════ Frame ═════════ */
.bg-mandala { position: fixed; z-index: -1; left: 50%; top: 42%; width: 620px; height: 620px; margin: -310px 0 0 -310px; opacity: .35; animation: spin 140s linear infinite; pointer-events: none; }
.sparkles { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
.sparkles i { position: absolute; width: 5px; height: 5px; background: var(--gold-2); border-radius: 50%; box-shadow: 0 0 10px 2px rgba(255,201,60,.8); animation: twinkle 2.8s ease-in-out infinite; }
.garland { display: block; width: 100%; height: 54px; filter: drop-shadow(0 3px 5px rgba(0,0,0,.35)); }
.garland .bell { transform-box: fill-box; transform-origin: 50% 0; animation: bell 2.4s ease-in-out infinite; }
.app { max-width: 560px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 10; padding: 0 16px 10px; background: linear-gradient(var(--maroon-2) 60%, transparent); }
.topbar .garland { margin: 0 -16px; }
.nav { display: flex; align-items: center; gap: 10px; margin-top: -6px; }
.back { width: 40px; height: 40px; border-radius: 13px; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.1); color: #fff; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.back svg { width: 20px; height: 20px; }
.back[disabled] { visibility: hidden; }
/* Progress: six little diyas that light up */
.progress { flex: 1; display: flex; justify-content: center; gap: 6px; }
.progress span { width: 30px; height: 30px; display: flex; align-items: flex-end; justify-content: center; position: relative; }
.progress svg { width: 30px; height: 30px; }
.progress .fl { opacity: 0; transform-origin: 50% 80%; transition: opacity .3s; }
.progress span.lit .fl { opacity: 1; animation: flicker 1.2s ease-in-out infinite; }
.progress span.now::after { content: ''; position: absolute; bottom: -6px; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
.progress span:not(.lit) .base { opacity: .45; }
.step-no { font-size: 12px; font-weight: 700; color: rgba(255,255,255,.7); width: 40px; text-align: right; }

.stage { flex: 1; padding: 6px 16px 150px; position: relative; }
.screen { animation: inR .38s cubic-bezier(.2,.8,.2,1) both; }
.screen.back-anim { animation-name: inL; }
.q { text-align: center; margin: 6px 0 18px; }
.q .eyebrow { font-family: var(--display); color: var(--gold); font-weight: 700; font-size: 15px; letter-spacing: .02em; }
.q h2 { font-size: clamp(26px, 7.5vw, 34px); line-height: 1.1; font-weight: 800; text-shadow: 0 3px 14px rgba(0,0,0,.35); }
.q p { margin: 6px auto 0; max-width: 380px; color: rgba(255,255,255,.82); font-size: 14.5px; line-height: 1.45; }
.panel { background: var(--card); color: var(--ink); border-radius: 28px; padding: 18px; box-shadow: 0 24px 50px -20px rgba(0,0,0,.6);
  border: 2px solid transparent; background-image: linear-gradient(var(--card), var(--card)), linear-gradient(135deg, var(--gold), var(--pink) 35%, var(--saffron) 65%, var(--gold)); background-origin: border-box; background-clip: padding-box, border-box; }

/* ═════════ Welcome ═════════ */
.welcome { text-align: center; padding-top: 4px; position: relative; }
.logo-ring { display: inline-block; padding: 8px; border-radius: 28px; background: conic-gradient(var(--gold), var(--saffron), var(--pink), var(--gold), var(--marigold), var(--gold)); box-shadow: 0 16px 36px -10px rgba(0,0,0,.6); }
.logo-chip { display: flex; background: #fff; border-radius: 21px; padding: 9px 16px; }
.logo-chip img { height: 54px; }
.welcome .gu { font-family: var(--display); font-size: 19px; font-weight: 700; color: var(--gold); margin: 18px 0 0; }
.welcome h1 { font-family: var(--fest); font-weight: 400; font-size: clamp(50px, 14vw, 72px); line-height: .95; margin-top: 4px;
  background: linear-gradient(100deg, #fff, var(--gold-2) 35%, #fff 50%, var(--gold) 70%, #fff); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 6s linear infinite; filter: drop-shadow(0 4px 14px rgba(0,0,0,.45)); }
.welcome .tag { font-family: var(--display); font-size: 17px; font-weight: 800; letter-spacing: .3em; color: var(--gold); }
.welcome .tag::before, .welcome .tag::after { content: '❋'; color: var(--pink); margin: 0 10px; letter-spacing: 0; font-size: 13px; vertical-align: 2px; }
.welcome p.lead { margin: 14px auto 0; max-width: 360px; font-size: 15.5px; line-height: 1.5; color: rgba(255,255,255,.9); }
.dancers { position: relative; height: 150px; margin-top: 10px; }
.dancer { position: absolute; bottom: 0; width: 100px; transform-origin: 50% 100%; animation: sway 2.2s ease-in-out infinite; filter: drop-shadow(0 8px 12px rgba(0,0,0,.4)); }
.dancer.l { left: calc(50% - 125px); } .dancer.r { right: calc(50% - 125px); animation-delay: -1.1s; }
.dancers .fire { position: absolute; left: 50%; bottom: 6px; width: 64px; margin-left: -32px; }
.dancers .fire .fl { transform-origin: 50% 85%; animation: flicker 1s ease-in-out infinite; }
.pills { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.hpill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; font-weight: 800; font-size: 13px; }
.hpill.dates { background: rgba(255,201,60,.16); border: 1px solid rgba(255,201,60,.55); color: var(--gold); }
.hpill.count { background: linear-gradient(135deg, var(--pink), var(--saffron)); color: #fff; }
.perks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 22px; }
.perks div { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); border-radius: 18px; padding: 12px 6px; font-size: 12px; font-weight: 700; line-height: 1.3; }
.perks b { display: block; font-size: 22px; margin-bottom: 4px; }

/* ═════════ Inputs ═════════ */
.big-in { width: 100%; height: 62px; border: 2px solid var(--field-line); border-radius: 20px; background: #fff; padding: 0 18px; font-size: 21px; font-weight: 700; color: var(--ink); outline: none; text-align: center; transition: border-color .2s, box-shadow .2s; }
.big-in:focus { border-color: var(--pink); box-shadow: 0 0 0 5px rgba(233,30,99,.15); }
.big-in::placeholder { color: var(--ink-3); font-weight: 500; }
.phone-wrap { display: flex; align-items: center; border: 2px solid var(--field-line); border-radius: 20px; background: #fff; overflow: hidden; transition: border-color .2s, box-shadow .2s; }
.phone-wrap:focus-within { border-color: var(--pink); box-shadow: 0 0 0 5px rgba(233,30,99,.15); }
.phone-wrap span { padding: 0 4px 0 16px; font-size: 19px; font-weight: 800; color: var(--ink-2); }
.phone-wrap input { flex: 1; min-width: 0; height: 58px; border: 0; outline: none; font-size: 21px; font-weight: 800; letter-spacing: .06em; padding-right: 14px; background: transparent; color: var(--ink); }
.in { width: 100%; height: 48px; border: 1.5px solid var(--field-line); border-radius: 14px; background: #fff; padding: 0 14px; font-size: 15px; outline: none; color: var(--ink); }
.in:focus { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(233,30,99,.14); }
textarea.in { height: auto; min-height: 70px; padding: 11px 14px; resize: vertical; }
.lbl { font-size: 13px; font-weight: 800; color: var(--ink-2); margin: 16px 2px 8px; text-transform: uppercase; letter-spacing: .06em; }
.lbl:first-child { margin-top: 0; }
.hint { text-align: center; font-size: 13px; color: var(--ink-2); margin: 10px 0 0; }
.err { color: #ffb4b4; font-size: 13px; font-weight: 700; text-align: center; margin-top: 12px; }
.panel .err { color: var(--red); }
.toggle { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.toggle input { width: 20px; height: 20px; accent-color: var(--pink); }

/* ═════════ Thali ═════════ */
.thali { position: relative; width: 210px; height: 210px; margin: -4px auto 10px; }
.thali svg.plate { width: 100%; height: 100%; filter: drop-shadow(0 18px 24px rgba(0,0,0,.45)); }
.thali .pile { position: absolute; inset: 0; }
.thali .pile i { position: absolute; width: 30px; height: 28px; margin: -14px 0 0 -15px; animation: pop .45s cubic-bezier(.3,1.6,.5,1) both; }
.thali .pile i svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 2px rgba(0,0,0,.3)); }
.thali .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; font-family: var(--display); font-weight: 700; color: #8a6d00; font-size: 14px; line-height: 1.2; padding: 50px; }
.thali .more { position: absolute; right: 6px; bottom: 18px; background: var(--pink); color: #fff; font-weight: 900; font-size: 13px; padding: 3px 9px; border-radius: 999px; box-shadow: 0 4px 10px rgba(0,0,0,.3); }
.menu { display: grid; gap: 9px; }
.item { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 20px; background: #fff; transition: border-color .2s, background .2s, box-shadow .2s; }
.item.on { border-color: var(--marigold); background: linear-gradient(110deg, #fff1d1, #fff 75%); box-shadow: 0 8px 18px -12px rgba(246,164,0,.9); }
.item .ic { width: 46px; height: 46px; border-radius: 15px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 30% 30%, #fff6d6, #ffd9c4); }
.item b { display: block; font-size: 15px; line-height: 1.2; }
.item .pr { display: inline-block; margin-top: 4px; font-size: 12px; font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--saffron), var(--pink)); padding: 2px 8px; border-radius: 8px; }
.item .sub { font-size: 12.5px; color: var(--maroon); font-weight: 800; margin-left: 6px; }
.qty { display: flex; align-items: center; border: 1.5px solid var(--marigold); border-radius: 14px; background: #fff; overflow: hidden; flex-shrink: 0; }
.qty button { width: 38px; height: 40px; border: 0; background: none; font-size: 22px; font-weight: 700; color: var(--saffron); }
.qty input { width: 46px; height: 40px; border: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line); text-align: center; font-weight: 800; font-size: 16px; outline: none; background: transparent; color: var(--ink); }
.add-btn { height: 40px; padding: 0 15px; border-radius: 14px; border: 1.5px solid var(--saffron); background: #fff; color: var(--saffron); font-weight: 800; font-size: 14px; flex-shrink: 0; }

/* ═════════ Garba ring of nights ═════════ */
.ring { position: relative; width: 300px; height: 300px; margin: 4px auto 0; }
.ring::before { content: ''; position: absolute; inset: 26px; border-radius: 50%; border: 2px dashed rgba(255,201,60,.5); }
.ring .center { position: absolute; left: 50%; top: 50%; width: 140px; height: 140px; margin: -70px 0 0 -70px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  background: radial-gradient(circle at 40% 35%, #fff8e1, #ffe0a3); color: var(--maroon); box-shadow: 0 14px 30px -10px rgba(0,0,0,.6), inset 0 0 0 5px rgba(255,255,255,.6); }
.ring .center b { font-family: var(--display); font-size: 30px; line-height: 1; font-weight: 800; }
.ring .center span { font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.ring .center small { font-size: 11px; font-weight: 800; color: var(--pink); text-transform: uppercase; letter-spacing: .08em; }
.night { position: absolute; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; border: 3px solid rgba(255,255,255,.85); color: #fff; background: var(--c); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
  box-shadow: 0 8px 16px -6px rgba(0,0,0,.55); transition: transform .25s cubic-bezier(.3,1.6,.5,1); }
.night b { font-family: var(--display); font-size: 20px; font-weight: 800; }
.night small { font-size: 9.5px; font-weight: 800; text-transform: uppercase; }
.night.on { transform: scale(1.22); animation: glow 1.6s infinite; z-index: 2; }
.night:disabled { opacity: .3; cursor: not-allowed; filter: grayscale(.6); }
.other-date { display: flex; align-items: center; gap: 10px; justify-content: center; margin-top: 14px; color: rgba(255,255,255,.85); font-size: 14px; font-weight: 600; }
.other-date input { height: 42px; border-radius: 12px; border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.12); color: #fff; padding: 0 10px; color-scheme: dark; font-weight: 700; }
.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.slot { display: flex; align-items: center; gap: 8px; padding: 11px 10px; border-radius: 16px; border: 1.5px solid var(--line); background: #fff; text-align: left; font-weight: 700; font-size: 13px; color: var(--ink); transition: all .15s; }
.slot i { font-style: normal; font-size: 20px; }
.slot.on { border-color: var(--pink); background: linear-gradient(135deg, var(--pink), var(--maroon)); color: #fff; box-shadow: 0 8px 16px -8px rgba(233,30,99,.8); }

/* ═════════ Choice cards ═════════ */
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice { position: relative; padding: 20px 12px 16px; border-radius: 24px; border: 2px solid var(--line); background: #fff; color: var(--ink); text-align: center; transition: transform .15s, border-color .2s, box-shadow .2s; }
.choice .em { font-size: 46px; display: block; line-height: 1; transition: transform .3s cubic-bezier(.3,1.6,.5,1); }
.choice b { display: block; font-family: var(--display); font-size: 19px; margin-top: 10px; }
.choice small { display: block; font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.choice.on { border-color: var(--pink); background: linear-gradient(160deg, #fff0f5, #fff 70%); box-shadow: 0 12px 26px -12px rgba(233,30,99,.8); }
.choice.on .em { transform: scale(1.15) rotate(-6deg); }
.choice.on::after { content: '✓'; position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; border-radius: 50%; background: var(--pink); color: #fff; font-weight: 900; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 14px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff; font-weight: 700; font-size: 13.5px; color: var(--ink); transition: all .15s; }
.chip.on { border-color: var(--pink); background: linear-gradient(135deg, var(--pink), var(--maroon)); color: #fff; }

/* ═════════ Pass (ticket) ═════════ */
.pass { position: relative; color: var(--ink); border-radius: 26px; overflow: hidden; background: #fffdf8; box-shadow: 0 26px 50px -18px rgba(0,0,0,.7); }
.pass-top { position: relative; padding: 16px 18px 18px; color: #fff; background: linear-gradient(130deg, var(--pink), var(--maroon) 60%, var(--maroon-2)); overflow: hidden; }
.pass-top::before { content: ''; position: absolute; inset: 0; opacity: .25; background: radial-gradient(circle, #ffc93c 1.2px, transparent 1.7px) 0 0 / 16px 16px; }
.pass-top .mand { position: absolute; right: -50px; top: -50px; width: 170px; height: 170px; opacity: .45; animation: spin 60s linear infinite; }
.pass-top .row { position: relative; display: flex; align-items: center; gap: 10px; }
.pass-top .lc { background: #fff; border-radius: 12px; padding: 4px 8px; display: flex; }
.pass-top .lc img { height: 28px; }
.pass-top .t { font-family: var(--fest); font-size: 24px; line-height: 1; color: var(--gold-2); }
.pass-top .t small { display: block; font-family: "Inter", sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .14em; color: rgba(255,255,255,.8); text-transform: uppercase; margin-top: 3px; }
.pass-top .who { position: relative; margin-top: 14px; padding-right: 100px; }
.pass-top .who small { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.75); }
.pass-top .who b { display: block; font-family: var(--display); font-size: 26px; line-height: 1.05; }
.pass-top .ref { position: absolute; right: 0; bottom: 2px; font-family: var(--display); font-weight: 800; font-size: 20px; color: var(--gold); letter-spacing: .04em; }
.perf { position: relative; height: 22px; background: #fffdf8; }
.perf::before { content: ''; position: absolute; left: 18px; right: 18px; top: 50%; border-top: 2.5px dashed var(--line); }
.perf::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 0 50%, var(--maroon-2) 11px, transparent 12px), radial-gradient(circle at 100% 50%, var(--maroon-2) 11px, transparent 12px); }
.pass-body { padding: 4px 18px 18px; }
.pass-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.pass-grid .k { font-size: 10.5px; font-weight: 800; color: var(--ink-3); text-transform: uppercase; letter-spacing: .1em; }
.pass-grid .v { font-weight: 800; font-size: 15px; line-height: 1.25; }
.pass-grid .v.day { display: inline-flex; align-items: center; gap: 6px; }
.pass-grid .v.day i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); display: inline-block; box-shadow: 0 0 0 2px rgba(0,0,0,.08); }
.pass-items { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 10px; }
.pass-items div { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 3px 0; }
.pass-items div span:first-child { color: var(--ink-2); }
.pass-total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; padding-top: 10px; border-top: 2px solid var(--ink); }
.pass-total span { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.pass-total b { font-family: var(--display); font-size: 30px; line-height: 1; color: var(--maroon); }

/* ═════════ Bottom action bar ═════════ */
.bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 20; width: calc(100% - 24px); max-width: 536px; display: flex; align-items: center; gap: 10px; }

.go { flex: 1; height: 60px; border: 0; border-radius: 20px; font-family: var(--display); font-weight: 800; font-size: 19px; color: #3a1d00; background: linear-gradient(135deg, var(--gold-2), var(--gold) 40%, var(--marigold)); box-shadow: 0 12px 26px -10px rgba(246,164,0,.9), inset 0 1px 0 rgba(255,255,255,.6); display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .1s, opacity .2s; }

/* Hold-to-light button */

.hold .fill { position: absolute; inset: 0; width: 0; background: linear-gradient(90deg, var(--marigold), var(--gold-2)); }
.hold .lbl2 { position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; height: 100%; transition: color .2s; }

.spin-s { display: inline-block; width: 20px; height: 20px; border-radius: 50%; border: 3px solid rgba(58,29,0,.3); border-top-color: #3a1d00; animation: spin .7s linear infinite; vertical-align: -4px; }

/* ═════════ Celebration ═════════ */
canvas#fx { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
.petal { position: fixed; top: -30px; z-index: 41; width: 12px; height: 16px; border-radius: 60% 60% 60% 0; pointer-events: none; animation: fall linear forwards; }

.done-actions { display: grid; gap: 10px; margin-top: 16px; }
.btn { height: 54px; border-radius: 18px; border: 0; font-weight: 800; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn.wa { background: #25d366; color: #fff; box-shadow: 0 10px 22px -10px rgba(37,211,102,.9); }
.btn.gold { background: linear-gradient(135deg, var(--gold-2), var(--gold) 40%, var(--marigold)); color: #3a1d00; }
.btn.ghost { background: rgba(255,255,255,.1); color: #fff; border: 1.5px solid rgba(255,255,255,.35); }
.btn svg { width: 20px; height: 20px; }

@media (max-width: 360px) { .ring { transform: scale(.88); margin: -14px auto -18px; } }

<body>
<svg class="bg-mandala" id="bg-mandala" viewBox="-220 -220 440 440" aria-hidden="true"></svg>
<div class="sparkles" id="sparkles" aria-hidden="true"></div>
<div class="floaters" id="floaters" aria-hidden="true"></div>

<div class="app">
  <header class="topbar">
    <svg class="garland" id="garland" viewBox="0 0 400 70" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div class="nav" id="nav">
      <button class="back" id="back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="progress" id="progress" aria-hidden="true"></div>
      <span class="step-no" id="step-no"></span>
    </div>
  </header>
  <main class="stage" id="stage" aria-live="polite"></main>
  <footer class="site" id="site-foot"></footer>
</div>
<div class="bar" id="bar"></div>
<canvas id="fx" class="hidden"></canvas>

<script>
'use strict';
const C = window.MAHARAJ, F = C.festival, NAV = FESTIVE.NAVRANG;
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const IST = 'Asia/Kolkata';
const today = new Intl.DateTimeFormat('en-CA', { timeZone: IST }).format(new Date());
const addDays = (ymd, n) => { const [y, m, d] = ymd.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); };
const dLabel = (ymd, o) => new Date(ymd + 'T12:00:00+05:30').toLocaleDateString('en-IN', { timeZone: IST, ...o });
const rs = (n) => '₹' + Math.round(n).toLocaleString('en-IN');
const q3 = (q) => String(Math.round(q * 1000) / 1000);
const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };
const cleanPhone = (v) => String(v || '').replace(/\D/g, '').replace(/^91(?=\d{10}$)/, '').replace(/^0(?=\d{10}$)/, '');

// Festival nights
const NIGHTS = [];
for (let d = F.start, i = 1; d <= F.end; d = addDays(d, 1), i++) NIGHTS.push({ d, i });
const nightOf = (d) => NIGHTS.find((n) => n.d === d);
const isDussehra = (n) => !!n && n.i === NIGHTS.length && NIGHTS.length >= 10;
const colorOf = (d) => { const n = nightOf(d); return n ? NAV[(n.i - 1) % NAV.length] : '#c2185b'; };
/** Dark text on light Nav-rang colours (yellow, cyan…), white on the rest */
const inkOn = (hex) => { const n = parseInt(hex.slice(1), 16), l = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; return l > 0.62 ? '#3a1d00' : '#fff'; };
const slotIcon = (s) => ['🌅', '🌤️', '☀️', '🌇', '🌆', '🪔', '🌙', '🌙'][Math.max(0, C.slots.indexOf(s))] || '🕒';

// ───────── State (kept on this phone so a refresh doesn't lose the order) ─────────
const DRAFT = 'mb-navratri-draft';
const S = Object.assign({ step: 0, name: '', qty: {}, date: '', slot: '', type: 'PICKUP', address: '', mobile: '', waSame: true, whatsapp: '', occasion: 'Garba', fry: 'Full Fry', notes: '' },
  (() => { try { return JSON.parse(localStorage.getItem(DRAFT) || '{}'); } catch { return {}; } })());
const save = () => { try { localStorage.setItem(DRAFT, JSON.stringify(S)); } catch {} };
const items = () => C.menu.filter((m) => S.qty[m.id] > 0).map((m) => ({ name: m.name, unit: m.unit, qty: S.qty[m.id], price: m.price }));
const total = () => items().reduce((a, it) => a + it.qty * it.price, 0);
const first = () => (S.name.trim().split(/\s+/)[0] || '').replace(/^./, (c) => c.toUpperCase());

const STEPS = ['welcome', 'name', 'thali', 'night', 'mode', 'contact', 'pass'];
const OCCASIONS = [['Garba', '💃'], ['Society event', '🏢'], ['Family function', '👨‍👩‍👧'], ['Office party', '💼'], ['Home', '🏠'], ['Other', '✨']];
const FRYS = [['Full Fry', '🔥', 'ready to eat'], ['Half Fry', '♨️', 'finish at home'], ['Raw / Frozen', '❄️', 'fry fresh later']];

// ───────── Art ─────────
const DIYA = `<svg viewBox="0 0 40 40"><path class="fl" d="M20 3c4 6 5 9 5 12a5 5 0 0 1-10 0c0-3 1-6 5-12Z" fill="#ffc93c"/><path class="fl" d="M20 9c2 3 2.5 4.5 2.5 6a2.5 2.5 0 0 1-5 0c0-1.5.5-3 2.5-6Z" fill="#e8491d"/><path class="base" d="M3 22h34c0 8-7.5 13-17 13S3 30 3 22Z" fill="#e91e63"/><path class="base" d="M3 22h34" stroke="#ffc93c" stroke-width="2.4" stroke-linecap="round"/></svg>`;
const SAMOSA = (c = '#f6a400') => `<svg viewBox="0 0 30 28"><path d="M15 2 28 25H2Z" fill="${c}" stroke="#a0300a" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 19h12M11.5 14.5h7" stroke="#a0300a" stroke-width="1.3" stroke-linecap="round"/></svg>`;
const TIKKI = `<svg viewBox="0 0 30 28"><ellipse cx="15" cy="15" rx="12" ry="9" fill="#f6a400" stroke="#a0300a" stroke-width="1.6"/><path d="M9 14c2-2 4-2 6 0s4 2 6 0" fill="none" stroke="#a0300a" stroke-width="1.3" stroke-linecap="round"/></svg>`;
const ICON = (name) => (/samosa/i.test(name) ? SAMOSA() : TIKKI).replace('<svg ', '<svg width="30" height="28" ');
const dancer = (s1, s2, choli, flip) => `<svg viewBox="0 0 100 150" ${flip ? 'style="transform:scaleX(-1)"' : ''}><defs><linearGradient id="d${s1.slice(1)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s1}"/><stop offset="1" stop-color="${s2}"/></linearGradient></defs>
  <g stroke-linecap="round"><line x1="27" y1="20" x2="17" y2="2" stroke="#ffc93c" stroke-width="3.2"/><line x1="27" y1="20" x2="17" y2="2" stroke="#e91e63" stroke-width="3.2" stroke-dasharray="3 4"/><line x1="73" y1="20" x2="83" y2="2" stroke="#ffc93c" stroke-width="3.2"/><line x1="73" y1="20" x2="83" y2="2" stroke="#2e7d32" stroke-width="3.2" stroke-dasharray="3 4"/></g>
  <path d="M44 44 L32 34 L27 20M56 44 L68 34 L73 20" fill="none" stroke="#c68a5e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="57" cy="22" r="5.5" fill="#2b1310"/><circle cx="50" cy="30" r="9" fill="#c68a5e"/><path d="M41 28a9 9 0 0 1 18 0c-3-4-15-4-18 0Z" fill="#2b1310"/><circle cx="50" cy="40" r="2" fill="#ffc93c"/>
  <path d="M43 42h14l2 22H41Z" fill="${choli}"/><path d="M41 64h18" stroke="#ffc93c" stroke-width="2"/>
  <path d="M41 64 Q20 104 6 132 Q50 146 94 132 Q80 104 59 64Z" fill="url(#d${s1.slice(1)})"/>
  <path d="M14 118 Q50 130 86 118" stroke="#ffc93c" stroke-width="2.5" fill="none"/><path d="M9 128 Q50 142 91 128" stroke="#ffc93c" stroke-width="3" fill="none" stroke-dasharray="1 4"/><path d="M24 98 Q50 108 76 98" stroke="#fff" stroke-width="1.5" fill="none" stroke-dasharray="1 5" opacity=".8"/></svg>`;

// ───────── Shell ─────────
$('#garland').innerHTML = FESTIVE.garland('top');
$('#bg-mandala').innerHTML = FESTIVE.mandala();
$('#sparkles').innerHTML = Array.from({ length: 26 }, () => `<i style="left:${Math.random() * 100}%;top:${Math.random() * 100}%;animation-delay:${(Math.random() * 3).toFixed(2)}s"></i>`).join('');
$('#floaters').innerHTML = Array.from({ length: 7 }, (_, i) => `<span style="left:${5 + Math.random() * 90}%;animation-duration:${(12 + Math.random() * 10).toFixed(1)}s;animation-delay:${(-Math.random() * 16).toFixed(1)}s">${['🪔', '✨', '🌼'][i % 3]}</span>`).join('');
$('#site-foot').innerHTML = `MAHARAJ FOODS · Estd. 1976 · <a href="tel:+91${C.phone}">${C.phone}</a>`;

let dir = 1;
function go(step) {
  dir = step >= S.step ? 1 : -1;
  S.step = Math.max(0, Math.min(STEPS.length - 1, step));
  save(); render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
$('#back').addEventListener('click', () => go(S.step - 1));

function renderProgress() {
  const n = STEPS.length - 1; // the welcome screen has no diya
  $('#progress').innerHTML = Array.from({ length: n }, (_, i) => `<span class="${i < S.step ? 'lit' : ''} ${i === S.step - 1 ? 'now' : ''}">${DIYA}</span>`).join('');
  $('#back').disabled = S.step === 0;
  $('#step-no').textContent = S.step ? `${S.step}/${n}` : '';
  $('#nav').style.visibility = S.step === 0 ? 'hidden' : 'visible';
}

const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
function totalChip() {
  const its = items();
  return its.length ? `<div class="total-chip"><small>${its.length} item${its.length > 1 ? 's' : ''}</small><b class="num" id="tchip">${rs(shownTotal)}</b></div>` : '';
}

// ───────── Screens ─────────
const screens = {
  welcome() {
    const days = Math.round((Date.parse(F.start) - Date.parse(today)) / 86400000);
    let count = '';
    if (days > 1) count = `✨ Starts in ${days} days`;
    else if (days === 1) count = '✨ Starts tomorrow!';
    else if (today <= F.end) { const n = nightOf(today); count = isDussehra(n) ? '🏹 Happy Dussehra!' : `💃 Night ${n ? n.i : ''} · Shubh ${F.name}!`; }
    const fmt = (d) => dLabel(d, { day: 'numeric', month: 'short' });
    return `<div class="welcome">
      <span class="logo-ring"><span class="logo-chip"><img src="logo.png" alt="Maharaj Samosa Center"></span></span>
      <p class="gu">કેમ છો! શુભ નવરાત્રી 🙏</p>
      <h1>Navratri</h1>
      <div class="tag">Special</div>
      <p class="lead">Nine nights of garba deserve the crispiest samosas. Fill your thali, pick your night and get your <b style="color:var(--gold)">Navratri Pass</b>.</p>
      <div class="pills"><span class="hpill dates">🪔 ${fmt(F.start)} – ${fmt(F.end)}</span>${count ? `<span class="hpill count">${count}</span>` : ''}</div>
      <div class="dancers" aria-hidden="true">
        <span class="dancer l">${dancer('#e91e63', '#8e1040', '#ffb300')}</span>
        <svg class="fire" viewBox="0 0 64 64"><path class="fl" d="M32 4c9 12 12 20 12 28a12 12 0 0 1-24 0c0-8 3-16 12-28Z" fill="#ffc93c"/><path class="fl" d="M32 18c5 7 6 11 6 15a6 6 0 0 1-12 0c0-4 1-8 6-15Z" fill="#e8491d"/><path d="M6 44h52c0 10-11 17-26 17S6 54 6 44Z" fill="#c2185b"/><path d="M6 44h52" stroke="#ffc93c" stroke-width="3.5" stroke-linecap="round"/></svg>
        <span class="dancer r">${dancer('#00897b', '#004d40', '#e65100', true)}</span>
      </div>
      <div class="perks"><div><b>🥟</b>Fresh by the dozen</div><div><b>💃</b>All ${NIGHTS.length >= 10 ? 9 : NIGHTS.length} nights</div><div><b>📲</b>Confirmed on WhatsApp</div></div>
    </div>`;
  },
  welcomeBar: () => `<button class="go" data-next>Start my order ${ARROW}</button>`,

  name() {
    return `<div class="q"><div class="eyebrow">Jai Mataji! 🙏</div><h2>What should we call you?</h2><p>Your name goes on your Navratri Pass.</p></div>
      <div class="panel"><input class="big-in" id="f-name" autocomplete="name" placeholder="Your name" value="${esc(S.name)}" maxlength="60" enterkeyhint="next" aria-label="Your name">
      <p class="hint" id="name-hint">${nameHint()}</p></div>`;
  },
  nameBar: () => `<button class="go" data-next ${S.name.trim() ? '' : 'disabled'}>Continue ${ARROW}</button>`,

  thali() {
    return `<div class="q"><div class="eyebrow">${first() ? esc(first()) + ', l' : 'L'}et's fill your thali</div><h2>What would you like?</h2><p>Tap + to add. Every dozen lands on your plate!</p></div>
      <div class="thali" aria-hidden="true">
        <svg class="plate" viewBox="0 0 210 210"><defs><radialGradient id="pl" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="#fff8e1"/><stop offset=".7" stop-color="#ffe082"/><stop offset="1" stop-color="#f6a400"/></radialGradient>
          <radialGradient id="rim" cx="50%" cy="50%" r="50%"><stop offset=".86" stop-color="#e0a100"/><stop offset=".93" stop-color="#ffe08a"/><stop offset="1" stop-color="#b8860b"/></radialGradient></defs>
          <circle cx="105" cy="105" r="100" fill="url(#rim)"/><circle cx="105" cy="105" r="86" fill="url(#pl)"/>
          <circle cx="105" cy="105" r="93" fill="none" stroke="#fff3c4" stroke-width="1.5" stroke-dasharray="2 6"/>
          ${Array.from({ length: 16 }, (_, i) => `<circle cx="${(105 + Math.cos(i * Math.PI / 8) * 93).toFixed(1)}" cy="${(105 + Math.sin(i * Math.PI / 8) * 93).toFixed(1)}" r="3" fill="${['#e91e63', '#2e7d32'][i % 2]}"/>`).join('')}</svg>
        <div class="pile" id="pile"></div>
      </div>
      <div class="panel"><div class="menu" id="menu"></div></div>`;
  },
  thaliBar: () => `${totalChip()}<button class="go" data-next ${items().length ? '' : 'disabled'}>Pick your night ${ARROW}</button>`,

  night() {
    const sel = nightOf(S.date);
    const R = 121;
    return `<div class="q"><div class="eyebrow">Step into the garba circle 💃</div><h2>Which night is your treat?</h2></div>
      <div class="ring">
        <div class="center">${S.date ? `<small>${sel ? (isDussehra(sel) ? 'Dussehra' : 'Night ' + sel.i) : 'Your date'}</small><b>${dLabel(S.date, { day: 'numeric', month: 'short' })}</b><span>${dLabel(S.date, { weekday: 'long' })}</span>`
          : `<span style="font-size:34px">🥢</span><span>Tap a night</span>`}</div>
        ${NIGHTS.map((n, k) => {
          const a = (k / NIGHTS.length) * 2 * Math.PI - Math.PI / 2;
          return `<button class="night ${S.date === n.d ? 'on' : ''}" data-date="${n.d}" style="left:${(150 + Math.cos(a) * R).toFixed(1)}px;top:${(150 + Math.sin(a) * R).toFixed(1)}px;--c:${NAV[(n.i - 1) % NAV.length]};color:${inkOn(NAV[(n.i - 1) % NAV.length])}" ${n.d < today ? 'disabled' : ''} aria-label="${isDussehra(n) ? 'Dussehra' : 'Night ' + n.i}, ${dLabel(n.d, { weekday: 'long', day: 'numeric', month: 'long' })}">
            <small>${isDussehra(n) ? '🏹' : 'Day ' + n.i}</small><b>${dLabel(n.d, { day: 'numeric' })}</b></button>`;
        }).join('')}
      </div>
      <label class="other-date">Another date? <input type="date" id="f-date" min="${today}" value="${S.date && !sel ? S.date : ''}"></label>
      <div class="panel" style="margin-top:16px"><div class="lbl">⏰ Pick a time slot</div>
        <div class="slots">${C.slots.map((s) => `<button class="slot ${S.slot === s ? 'on' : ''}" data-slot="${esc(s)}"><i>${slotIcon(s)}</i>${esc(s)}</button>`).join('')}</div></div>`;
  },
  nightBar: () => `${totalChip()}<button class="go" data-next ${S.date && S.slot ? '' : 'disabled'}>${!S.date ? 'Tap a night' : !S.slot ? 'Pick a time slot' : `Continue ${ARROW}`}</button>`,

  mode() {
    return `<div class="q"><div class="eyebrow">Almost there, ${esc(first() || 'friend')}!</div><h2>How will you get it?</h2></div>
      <div class="choices">
        <button class="choice ${S.type === 'PICKUP' ? 'on' : ''}" data-type="PICKUP"><span class="em">🛍️</span><b>Pickup</b><small>Collect hot & fresh from our shop</small></button>
        <button class="choice ${S.type === 'DELIVERY' ? 'on' : ''}" data-type="DELIVERY"><span class="em">🛵</span><b>Delivery</b><small>We bring it to your garba</small></button>
      </div>
      ${S.type === 'DELIVERY' ? `<div class="panel" style="margin-top:14px"><div class="lbl">📍 Delivery address</div><textarea class="in" id="f-address" rows="3" placeholder="Flat / society, area, landmark">${esc(S.address)}</textarea></div>`
        : `<div class="panel" style="margin-top:14px;display:flex;gap:12px;align-items:center"><span style="font-size:28px">📍</span><div style="font-size:13.5px;line-height:1.4"><b>${esc(C.businessName)}</b><br><span style="color:var(--ink-2)">${esc(C.address)}</span></div></div>`}`;
  },
  modeBar: () => `${totalChip()}<button class="go" data-next ${S.type === 'DELIVERY' && !S.address.trim() ? 'disabled' : ''}>${S.type === 'DELIVERY' && !S.address.trim() ? 'Add your address' : `Continue ${ARROW}`}</button>`,

  contact() {
    return `<div class="q"><div class="eyebrow">Last step ✨</div><h2>Where do we confirm?</h2><p>We'll call or WhatsApp you to confirm your order.</p></div>
      <div class="panel">
        <div class="lbl">📱 Mobile number</div>

  const pieces = [];
  C.menu.forEach((m, k) => {
    const n = Math.ceil((S.qty[m.id] || 0) / m.step);
    for (let i = 0; i < n; i++) pieces.push({ samosa: /samosa/i.test(m.name), c: ['#f6a400', '#f9b233', '#e9962a', '#ffb74d', '#ffca28', '#ffa726', '#f57c00', '#ffb300', '#ffd54f'][k % 9] });
  });
  const MAX = 26, vis = pieces.slice(0, MAX);
  pile.innerHTML = vis.map((p, i) => {
    const a = i * 2.4, r = 10 + Math.sqrt(i) * 13;
    const x = 105 + Math.cos(a) * Math.min(r, 66), y = 105 + Math.sin(a) * Math.min(r, 62);
    const fresh = !initial && i >= shown;
    return `<i style="left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;--r:${((i * 47) % 50) - 25}deg;${fresh ? '' : 'animation:none;transform:rotate(var(--r))'}">${p.samosa ? SAMOSA(p.c) : TIKKI}</i>`;

// ───────── Hold to light the diya ─────────
let holdRaf = null, holdStart = 0, sending = false;
const HOLD_MS = 1300;
function setupHold() {
  const b = $('#hold'); if (!b) return;
  const start = (e) => {
    if (sending || holdRaf) return;
    e.preventDefault();
    b.classList.add('holding'); holdStart = performance.now(); buzz(20);
    $('#hold-text').textContent = 'Keep holding…';
    const tick = (t) => {
      const p = Math.min(1, (t - holdStart) / HOLD_MS);
      $('#hold-fill').style.width = (p * 100) + '%';
      $('.hold .flame').style.transform = `scale(${1 + p * .6})`;
      if (p >= 1) { holdRaf = null; buzz([30, 40, 60]); submit(); return; }
      holdRaf = requestAnimationFrame(tick);
    };
    holdRaf = requestAnimationFrame(tick);
  };
  const stop = () => {
    if (!holdRaf) return;
    cancelAnimationFrame(holdRaf); holdRaf = null;
    b.classList.remove('holding');
    const fill = $('#hold-fill');
    fill.style.transition = 'width .3s'; fill.style.width = '0';
    setTimeout(() => { fill.style.transition = ''; }, 320);
    $('.hold .flame').style.transform = '';
    $('#hold-text').textContent = 'Hold a little longer 🪔';
  };
  b.addEventListener('pointerdown', start);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => b.addEventListener(ev, stop));
  b.addEventListener('contextmenu', (e) => e.preventDefault());
  b.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) start(e); });
  b.addEventListener('keyup', (e) => { if (e.key === 'Enter' || e.key === ' ') stop(); });
}

function bellSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.55].forEach((delay) => [[880, .2], [1318, .1], [2093, .04]].forEach(([f, v]) => {
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = f;
      g.gain.setValueAtTime(0, ctx.currentTime + delay);
      g.gain.linearRampToValueAtTime(v, ctx.currentTime + delay + .01);
      g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + delay + 2.2);
      osc.connect(g).connect(ctx.destination); osc.start(ctx.currentTime + delay); osc.stop(ctx.currentTime + delay + 2.3);
    }));
  } catch {}
}
function fireworks() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  let n = 0;
  const timer = setInterval(() => { burst(innerWidth * (.15 + Math.random() * .7), innerHeight * (.12 + Math.random() * .35)); if (++n >= 7) clearInterval(timer); }, 280);
  const t0 = performance.now();
  (function loop(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += .06; p.vx *= .985; p.life -= .012; if (p.life > 0) { ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, 7); ctx.fill(); } }

    <p class="small-note">Tip: take a screenshot of your pass 📸<br>Final amount may change slightly with packing or delivery. Pay at pickup or delivery (Cash or UPI).</p>
  </div>`;
  $('#bar').innerHTML = '';
  $('#again').addEventListener('click', () => { Object.assign(S, { step: 2, qty: {}, date: '', slot: '', notes: '' }); sending = false; save(); render(); });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

if (!(S.step >= 0 && S.step < STEPS.length)) S.step = 0;
render();
</script>
</body>
</html>
