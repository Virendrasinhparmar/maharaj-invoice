<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#4a0822" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" href="icon-192.png" />
<title>Navratri Orders · Maharaj</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@600;700;800&family=Yatra+One&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="config.js"></script>
<script src="festive.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('mb-theme'); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
:root {
  color-scheme: light;
  --maroon: #6d0f33; --maroon-2: #4a0822; --maroon-3: #2a0413; --pink: #e91e63; --magenta: #c2185b; --saffron: #e8491d; --gold: #ffc93c; --gold-2: #ffe08a; --marigold: #f6a400;
  --bg: #fbf4ea; --card: #ffffff; --card-2: #fff9f1; --ink: #26170f; --ink-2: #6e5d50; --ink-3: #ab9b8d; --line: #efe2d3; --line-2: #f7efe5;
  --field: #fff; --field-line: #e3d5c5; --green: #0f9d6b; --green-50: #e3f7ee; --red: #dc2f2f; --red-50: #fdecec; --amber: #c27c00; --amber-50: #fff3d6;
  --blue: #1e6fd9; --blue-50: #e8f0fd; --violet: #7c3aed; --violet-50: #f0e9fe;
  --shadow: 0 10px 26px -14px rgba(109,15,51,.28); --shadow-lg: 0 24px 50px -20px rgba(74,8,34,.45);
  --display: "Baloo Bhai 2", "Inter", system-ui, sans-serif; --fest: "Yatra One", "Baloo Bhai 2", serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #120a0b; --card: #1d1315; --card-2: #24181a; --ink: #f7ede3; --ink-2: #c3b0a6; --ink-3: #85736c; --line: #36262a; --line-2: #2a1d20;
  --field: #170f11; --field-line: #46343a; --green: #34d399; --green-50: #0f2b21; --red: #f87171; --red-50: #3a1616; --amber: #fbbf24; --amber-50: #33270c;
  --blue: #60a5fa; --blue-50: #13233a; --violet: #a78bfa; --violet-50: #241a3a;
  --shadow: 0 10px 26px -14px rgba(0,0,0,.8); --shadow-lg: 0 24px 50px -20px rgba(0,0,0,.9);
}
* { box-sizing: border-box; }
html { background: var(--bg); color: var(--ink); font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
body { margin: 0; min-height: 100dvh; background: radial-gradient(circle at 1px 1px, rgba(194,24,91,.07) 1.2px, transparent 1.6px) 0 0 / 18px 18px, var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 920px; margin: 0 auto; padding: 0 16px; }
h1, h2, h3 { font-family: var(--display); margin: 0; }
.hidden { display: none !important; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bell { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,201,60,.7); } 50% { box-shadow: 0 0 0 7px rgba(255,201,60,0); } }
.garland { display: block; width: 100%; height: 56px; filter: drop-shadow(0 3px 5px rgba(0,0,0,.3)); }
.garland .bell { transform-box: fill-box; transform-origin: 50% 0; animation: bell 2.4s ease-in-out infinite; }

/* ═════════ Login ═════════ */
.login { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; padding: 0 20px 20px; position: relative; overflow: hidden; isolation: isolate;
  background: radial-gradient(circle at 50% 40%, rgba(255,201,60,.22), transparent 45%), radial-gradient(120% 80% at 50% 0%, #a3154a, var(--maroon) 45%, var(--maroon-3)); }
.login::before { content: ''; position: absolute; inset: 0; z-index: -1; opacity: .2; background: radial-gradient(circle, #ffc93c 1.3px, transparent 1.8px) 0 0 / 22px 22px, radial-gradient(circle, #fff 1px, transparent 1.5px) 11px 11px / 22px 22px; }
.login .garland { position: absolute; top: 0; left: 0; right: 0; height: 70px; }
.login .mandala { position: absolute; z-index: -1; left: 50%; top: 50%; width: 600px; height: 600px; margin: -300px 0 0 -300px; opacity: .45; animation: spin 120s linear infinite; }
.login .box { margin: auto 0; width: 100%; max-width: 380px; padding: 26px 24px 24px; text-align: center; background: var(--card); border-radius: 28px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.7);
  border: 2px solid transparent; background-image: linear-gradient(var(--card), var(--card)), linear-gradient(135deg, var(--gold), var(--pink) 40%, var(--saffron) 70%, var(--gold)); background-origin: border-box; background-clip: padding-box, border-box; animation: rise .4s ease-out both; }
.login img { width: 180px; max-width: 70%; }
.login h2 { font-family: var(--fest); font-weight: 400; font-size: 30px; color: var(--maroon); margin-top: 8px; }
:root[data-theme="dark"] .login h2 { color: var(--gold); }
.login .gu { font-family: var(--display); color: var(--pink); font-weight: 700; margin: 0 0 8px; }
.login form { text-align: left; }
label.f { display: block; margin-top: 12px; }
label.f > span { display: block; font-size: 12px; font-weight: 800; color: var(--ink-2); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .06em; }
.in { width: 100%; height: 48px; border: 1.5px solid var(--field-line); border-radius: 14px; background: var(--field); padding: 0 14px; font-size: 15px; outline: none; transition: border-color .15s, box-shadow .15s; }
.in:focus { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(233,30,99,.15); }
.btn { height: 46px; padding: 0 18px; border-radius: 14px; border: 0; font-weight: 800; font-size: 15px; color: #fff; background: linear-gradient(135deg, var(--pink), var(--maroon)); display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; white-space: nowrap; transition: transform .1s; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .5; }
.btn.sm { height: 36px; padding: 0 12px; font-size: 13px; border-radius: 11px; }
.btn.ghost { background: var(--card); color: var(--ink); border: 1.5px solid var(--field-line); }
.btn.gold { background: linear-gradient(135deg, var(--gold-2), var(--gold) 40%, var(--marigold)); color: #3a1d00; }
.btn svg { width: 17px; height: 17px; }
.err { color: var(--red); font-size: 13px; font-weight: 600; margin-top: 12px; line-height: 1.5; }
.err code { background: var(--card-2); padding: 1px 5px; border-radius: 5px; }

/* ═════════ Hero ═════════ */
.hero { position: relative; color: #fff; overflow: hidden; isolation: isolate; padding-bottom: 54px;
  background: radial-gradient(circle at 80% 20%, rgba(255,201,60,.25), transparent 40%), linear-gradient(140deg, #a3154a, var(--maroon) 45%, var(--maroon-2) 80%); }
.hero::before { content: ''; position: absolute; inset: 0; z-index: -1; opacity: .18; background: radial-gradient(circle, #ffc93c 1.2px, transparent 1.7px) 0 0 / 20px 20px; }
.hero .mandala { position: absolute; z-index: -1; right: -120px; top: -40px; width: 380px; height: 380px; opacity: .45; animation: spin 100s linear infinite; }
.hero .bar { display: flex; align-items: center; gap: 10px; padding-top: 2px; }
.logo-chip { background: #fff; border-radius: 13px; padding: 4px 8px; display: flex; flex-shrink: 0; box-shadow: 0 6px 14px -6px rgba(0,0,0,.5); }
.logo-chip img { height: 30px; }
.hero .bar .grow { flex: 1; min-width: 0; font-size: 12px; font-weight: 700; color: rgba(255,255,255,.75); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.12); color: #fff; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.icon-btn svg { width: 18px; height: 18px; }
.spinning svg { animation: spin .8s linear infinite; }
#theme-btn .sun { display: none; }
:root[data-theme="dark"] #theme-btn .sun { display: block; }
:root[data-theme="dark"] #theme-btn .moon { display: none; }
.hello { margin-top: 18px; }
.hello .gu { font-family: var(--display); color: var(--gold); font-weight: 700; font-size: 15px; }
.hello h1 { font-family: var(--fest); font-weight: 400; font-size: clamp(30px, 8vw, 40px); line-height: 1.05; }
.hello .big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.hello .big b { font-family: var(--display); font-size: clamp(38px, 11vw, 52px); line-height: 1; color: var(--gold-2); }
.hello .big span { font-size: 14px; font-weight: 600; color: rgba(255,255,255,.85); }
.badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.hb { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 800; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); }
.hb.new { background: var(--gold); color: #3a1d00; border-color: var(--gold); animation: pulse 2s infinite; }
.hb i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }

/* ═════════ Night picker ═════════ */
.nights-wrap { position: relative; z-index: 2; margin-top: -40px; }
.nights { display: flex; gap: 10px; overflow-x: auto; padding: 8px 20px 10px; margin: 0 -16px; scrollbar-width: none; scroll-snap-type: x proximity; }
.nights::-webkit-scrollbar { display: none; }
.nt { flex-shrink: 0; scroll-snap-align: start; width: 66px; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 0; color: var(--ink); }
.nt .c { position: relative; width: 58px; height: 58px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; border: 3px solid var(--card); background: var(--c); color: var(--t, #fff); box-shadow: 0 8px 16px -8px rgba(0,0,0,.5); transition: transform .2s cubic-bezier(.3,1.6,.5,1); }
.nt .c b { font-family: var(--display); font-size: 19px; }
.nt .c small { font-size: 9px; font-weight: 800; text-transform: uppercase; }
.nt .k { position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--ink); color: var(--card); font-size: 11.5px; font-weight: 900; display: flex; align-items: center; justify-content: center; border: 2px solid var(--card); }
.nt span.l { font-size: 11px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.nt.on .c { transform: scale(1.12); box-shadow: 0 0 0 3px var(--gold), 0 10px 20px -8px rgba(0,0,0,.6); }
.nt.on span.l { color: var(--ink); font-weight: 800; }
.nt.today span.l::before { content: '● '; color: var(--pink); }
.nt.all .c { background: conic-gradient(#e53935, #fb8c00, #fdd835, #43a047, #00acc1, #1e88e5, #8e24aa, #d81b60, #e53935); }
.nt.all .c::after { content: ''; position: absolute; inset: 9px; border-radius: 50%; background: var(--card); }
.nt.all .c b { position: relative; z-index: 1; color: var(--ink); font-size: 14px; }

/* ═════════ KPIs & chart ═════════ */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 6px; }
@media (max-width: 680px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
.kpi { position: relative; overflow: hidden; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 13px 14px; box-shadow: var(--shadow); animation: rise .35s ease-out both; }
.kpi .ic { position: absolute; right: 10px; top: 10px; width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 17px; background: var(--card-2); }
.kpi p { margin: 0; font-size: 12px; font-weight: 700; color: var(--ink-2); }
.kpi b { display: block; font-family: var(--display); font-size: 27px; line-height: 1.15; margin-top: 4px; }
.kpi small { font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
.kpi.hl { background: linear-gradient(140deg, var(--pink), var(--maroon)); border: 0; color: #fff; }
.kpi.hl p, .kpi.hl small { color: rgba(255,255,255,.85); }
.kpi.hl .ic { background: rgba(255,255,255,.18); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); }
.chart { margin-top: 12px; padding: 14px 16px 10px; }
.chart .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.chart .hd b { font-family: var(--display); font-size: 16px; }
.chart .hd span { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 110px; margin-top: 10px; border-bottom: 1px solid var(--line); }
.bars button { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; background: none; border: 0; padding: 0; }
.bars i { display: block; width: 100%; max-width: 38px; border-radius: 6px 6px 2px 2px; background: color-mix(in srgb, var(--pink) 35%, var(--card)); transition: background .15s; min-height: 2px; }
.bars button.on i, .bars button:hover i { background: var(--pink); }
.bars em { font-style: normal; font-size: 11px; font-weight: 800; color: var(--ink-2); }
.bars-x { display: flex; gap: 6px; margin-top: 4px; }
.bars-x span { flex: 1; text-align: center; font-size: 10.5px; color: var(--ink-3); font-weight: 700; }

/* ═════════ Toolbar ═════════ */
.seg { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px; margin-top: 14px; box-shadow: var(--shadow); }
.seg button { flex: 1; height: 42px; border: 0; border-radius: 12px; background: none; font-weight: 800; font-size: 14px; color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.seg button.on { background: linear-gradient(135deg, var(--pink), var(--maroon)); color: #fff; box-shadow: 0 6px 14px -6px rgba(233,30,99,.7); }
.filters { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.chip { flex-shrink: 0; height: 34px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--field-line); background: var(--card); font-weight: 700; font-size: 12.5px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--ink-3)); }
.chip .n { font-size: 11px; opacity: .7; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.toolrow { display: flex; gap: 8px; margin-top: 8px; }
.search { position: relative; flex: 1; }
.search svg { position: absolute; left: 12px; top: 50%; width: 17px; height: 17px; transform: translateY(-50%); color: var(--ink-3); }
.search .in { padding-left: 38px; height: 44px; }
.share { display: flex; gap: 12px; align-items: center; padding: 12px 14px; margin-top: 12px; border-radius: 18px; background: linear-gradient(110deg, #fff4dc, var(--card) 70%); border: 1.5px dashed var(--marigold); }
:root[data-theme="dark"] .share { background: linear-gradient(110deg, #33270c, var(--card) 70%); }
.share code { font-size: 12px; word-break: break-all; color: var(--ink-2); }

/* ═════════ Order passes ═════════ */
.list { display: grid; gap: 12px; margin-top: 12px; }
@media (min-width: 760px) { .list { grid-template-columns: 1fr 1fr; } }
.op { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); animation: rise .3s ease-out both; }
.op.cancel { opacity: .6; }
.stub { width: 64px; flex-shrink: 0; background: var(--c); color: var(--t, #fff); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; position: relative; padding: 10px 4px; }
.stub::after { content: ''; position: absolute; right: -1px; top: 10px; bottom: 10px; border-right: 2.5px dashed var(--card); }
.stub small { font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; opacity: .9; }
.stub b { font-family: var(--display); font-size: 26px; line-height: 1; }
.stub span { font-size: 10.5px; font-weight: 800; line-height: 1.15; opacity: .95; }
.op .body { flex: 1; min-width: 0; padding: 12px 14px 12px; }
.op .top { display: flex; align-items: flex-start; gap: 8px; }
.op .who { flex: 1; min-width: 0; }
.op .who b { display: block; font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.op .who span { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.op .amt { font-family: var(--display); font-weight: 800; font-size: 20px; line-height: 1; white-space: nowrap; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 8px; background: var(--card-2); border: 1px solid var(--line); }
.its { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.its span { font-size: 13px; padding: 4px 9px; border-radius: 10px; background: color-mix(in srgb, var(--marigold) 14%, var(--card)); border: 1px solid color-mix(in srgb, var(--marigold) 35%, transparent); }
.its span b { color: var(--saffron); font-variant-numeric: tabular-nums; }
.op .note { margin-top: 8px; font-size: 12.5px; background: var(--amber-50); padding: 7px 10px; border-radius: 10px; }
.op .addr { margin-top: 6px; font-size: 12.5px; color: var(--ink-2); }
/* Status timeline */
.flow { display: flex; align-items: center; margin-top: 12px; }
.flow .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--line); border: 2px solid var(--card); box-shadow: 0 0 0 1.5px var(--line); flex-shrink: 0; position: relative; }
.flow .dot.done { background: var(--green); box-shadow: 0 0 0 1.5px var(--green); }
.flow .dot.cur { background: var(--gold); box-shadow: 0 0 0 1.5px var(--marigold); animation: pulse 2s infinite; }
.flow .ln { flex: 1; height: 3px; background: var(--line); }
.flow .ln.done { background: var(--green); }
.flow-l { display: flex; justify-content: space-between; margin-top: 4px; font-size: 9.5px; font-weight: 800; color: var(--ink-3); text-transform: uppercase; letter-spacing: .03em; }
.flow-l .on { color: var(--ink); }
.acts { display: flex; gap: 6px; margin-top: 12px; align-items: center; }
.acts .next { flex: 1; }
@media (max-width: 560px) { .acts { flex-wrap: wrap; } .acts .next { flex-basis: 100%; height: 42px; } .acts .ib { flex: 1; } }
.ib { width: 38px; height: 38px; border-radius: 12px; border: 1.5px solid var(--field-line); background: var(--card); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--ink); text-decoration: none; }
.ib svg { width: 18px; height: 18px; }
.ib.wa { color: #25d366; }
.more-menu { position: relative; }
.more-menu select { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.badge { font-size: 10px; font-weight: 900; letter-spacing: .05em; padding: 4px 8px; border-radius: 999px; text-transform: uppercase; }
.s-NEW { background: var(--blue-50); color: var(--blue); } .s-CONFIRMED { background: var(--violet-50); color: var(--violet); }
.s-PREPARING { background: var(--amber-50); color: var(--amber); } .s-READY { background: var(--green-50); color: var(--green); }
.s-DELIVERED { background: var(--line-2); color: var(--ink-2); } .s-CANCELLED { background: var(--red-50); color: var(--red); }
.empty { text-align: center; padding: 40px 16px; color: var(--ink-2); }
.empty .em { font-size: 46px; display: block; margin-bottom: 6px; }

/* ═════════ Kitchen ═════════ */
.prep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
.pt { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 14px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.pt::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(var(--gold), var(--saffron)); }
.pt .nm { font-size: 13px; font-weight: 700; color: var(--ink-2); line-height: 1.25; min-height: 32px; }
.pt .q { font-family: var(--display); font-size: 34px; line-height: 1; margin-top: 6px; color: var(--saffron); }
.pt .q small { font-size: 14px; color: var(--ink-2); margin-left: 3px; }
.pt .fry { display: flex; height: 7px; border-radius: 99px; overflow: hidden; margin-top: 10px; background: var(--line-2); }
.pt .fry i { display: block; }
.pt .legend { font-size: 11px; color: var(--ink-2); margin-top: 6px; line-height: 1.4; }
.slots { margin-top: 14px; overflow: hidden; }
table.st { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.st th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); padding: 10px; background: var(--card-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
table.st td { padding: 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
table.st .r { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
table.st tr.tot td { font-weight: 900; border-top: 2px solid var(--ink); }
.toast { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 80; background: #26170f; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 700; box-shadow: 0 12px 30px -10px rgba(0,0,0,.5); animation: rise .2s; }
.toast.ok { background: #0b8a5c; } .toast.bad { background: #c02a2f; }
@media print {
  .hero, .nights-wrap, .no-print, .seg, .filters, .toolrow, .share, .chart, .kpis { display: none !important; }
  html, body { background: #fff !important; color: #000; }
  .card, .pt { box-shadow: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>

<!-- ═══════ Login ═══════ -->
<section class="login" id="login-view">
  <svg class="garland" id="lg-garland" viewBox="0 0 400 70" preserveAspectRatio="none" aria-hidden="true"></svg>
  <svg class="mandala" id="lg-mandala" viewBox="-220 -220 440 440" aria-hidden="true"></svg>
  <div class="box">
    <img src="logo.png" alt="Maharaj">
    <h2>Navratri Orders</h2>
    <p class="gu">શુભ નવરાત્રી · Owner login</p>
    <form id="login-form">
      <label class="f"><span>Username</span><input class="in" id="lg-user" autocomplete="username" autocapitalize="none" required></label>
      <label class="f"><span>Password</span><input class="in" id="lg-pass" type="password" autocomplete="current-password" required></label>
      <div class="err hidden" id="lg-err"></div>
      <button class="btn" style="width:100%;margin-top:18px;height:50px" id="lg-btn">Log in</button>
    </form>
  </div>
</section>

<!-- ═══════ Dashboard ═══════ -->
<div id="app-view" class="hidden">
  <header class="hero">
    <svg class="garland" id="garland" viewBox="0 0 400 70" preserveAspectRatio="none" aria-hidden="true"></svg>
    <svg class="mandala" id="hero-mandala" viewBox="-220 -220 440 440" aria-hidden="true"><use href="#mandala-g"/></svg>
    <div class="wrap">
      <div class="bar">
        <span class="logo-chip"><img src="logo.png" alt=""></span>
        <span class="grow" id="sub">Loading…</span>
        <button class="icon-btn" id="refresh" aria-label="Refresh orders" title="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg></button>
        <button class="icon-btn" id="theme-btn" aria-label="Switch dark / light mode"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button class="icon-btn" id="logout" aria-label="Log out" title="Log out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
      </div>
      <div class="hello" id="hello"></div>
    </div>
  </header>

  <main class="wrap" style="padding-bottom:40px">
    <div class="nights-wrap"><div class="nights" id="nights"></div></div>
    <div class="kpis" id="kpis"></div>
    <div class="card chart no-print" id="chart"></div>
    <div class="share no-print">
      <span style="font-size:24px">🔗</span>
      <div style="flex:1;min-width:0"><b style="font-size:13.5px">Customer order link</b><br><code id="order-link"></code></div>
      <button class="btn sm gold" id="share-link">Share</button>
    </div>
    <div class="seg"><button class="on" data-tab="orders">📋 Orders</button><button data-tab="prep">🍳 Kitchen prep</button></div>

    <div id="orders-tab">
      <div class="filters" id="status-chips"></div>
      <div class="toolrow">
        <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="in" id="search" placeholder="Search name, mobile or NAV-0001" aria-label="Search orders"></label>
        <button class="btn ghost" id="xls" title="Download Excel">⬇ Excel</button>
      </div>
      <div class="list" id="orders"></div>
    </div>

    <div id="prep-tab" class="hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px">
        <h3 id="prep-title" style="font-size:19px">Kitchen prep</h3>
        <button class="btn sm ghost no-print" onclick="window.print()">🖨 Print</button>
      </div>
      <div id="prep"></div>
    </div>
  </main>
</div>

<script>
'use strict';
const C = window.MAHARAJ, F = C.festival, NAV = FESTIVE.NAVRANG;
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const IST = 'Asia/Kolkata';
const today = () => new Intl.DateTimeFormat('en-CA', { timeZone: IST }).format(new Date());
const addDays = (ymd, n) => { const [y, m, d] = ymd.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); };
const dLabel = (ymd, o = { weekday: 'short', day: 'numeric', month: 'short' }) => (ymd ? new Date(ymd + 'T12:00:00+05:30').toLocaleDateString('en-IN', { timeZone: IST, ...o }) : '—');
const rs = (n) => '₹' + Math.round(n).toLocaleString('en-IN');
const q3 = (n) => String(Math.round(n * 1000) / 1000);
const inkOn = (hex) => { const n = parseInt(hex.slice(1), 16), l = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; return l > 0.62 ? '#3a1d00' : '#fff'; };
const STATUSES = ['NEW', 'CONFIRMED', 'PREPARING', 'READY', 'DELIVERED', 'CANCELLED'];
const FLOW = ['NEW', 'CONFIRMED', 'PREPARING', 'READY', 'DELIVERED'];
const NEXT = { NEW: ['CONFIRMED', '✓ Confirm order'], CONFIRMED: ['PREPARING', '🍳 Start preparing'], PREPARING: ['READY', '🛍️ Mark ready'], READY: ['DELIVERED', '🎉 Handed over'] };
const DOT = { NEW: 'var(--blue)', CONFIRMED: 'var(--violet)', PREPARING: 'var(--amber)', READY: 'var(--green)', DELIVERED: 'var(--ink-3)', CANCELLED: 'var(--red)' };
const SESSION = 'mb-leads-auth';

const NIGHTS = [];
for (let d = F.start, i = 1; d <= F.end; d = addDays(d, 1), i++) NIGHTS.push({ d, i });
const nightOf = (d) => NIGHTS.find((n) => n.d === d);
const isDussehra = (n) => !!n && n.i === NIGHTS.length && NIGHTS.length >= 10;
const colorOf = (d) => { const n = nightOf(d); return n ? NAV[(n.i - 1) % NAV.length] : '#6d0f33'; };

let creds = null, orders = [], view = { tab: 'orders', date: 'ALL', status: 'ACTIVE', q: '' }, timer = null;

function toast(m, k = '') { const t = document.createElement('div'); t.className = 'toast ' + k; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
async function api(body) {
  if (!C.API_URL) throw new Error('NOT_SETUP');
  let res;
  try { res = await fetch(C.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }); }
  catch { throw new Error('Cannot reach the order server. Check internet.'); }
  const j = await res.json().catch(() => ({ ok: false, error: 'Unexpected reply from server' }));
  if (!j.ok) throw new Error(j.error || 'Request failed');
  return j;
}

// ───────── Art & theme ─────────
$('#lg-garland').innerHTML = FESTIVE.garland('lg');
$('#garland').innerHTML = FESTIVE.garland('top');
$('#lg-mandala').innerHTML = FESTIVE.mandala();
$('#theme-btn').addEventListener('click', () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('mb-theme', t); } catch {}
});

// ───────── Login ─────────
$('#login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const user = $('#lg-user').value.trim(), pass = $('#lg-pass').value;
  $('#lg-err').classList.add('hidden');
  $('#lg-btn').disabled = true; $('#lg-btn').textContent = 'Checking…';
  try {
    await api({ action: 'login', user, pass });
    creds = { user, pass };
    try { sessionStorage.setItem(SESSION, JSON.stringify(creds)); } catch {}
    enter();
  } catch (err) {
    $('#lg-err').classList.remove('hidden');
    $('#lg-err').innerHTML = err.message === 'NOT_SETUP'
      ? '<b>Order server not connected yet.</b> Follow README → "Navratri orders" to create the free Google Sheet, then paste its Web-app link into <code>config.js</code> → <code>API_URL</code>.'
      : esc(err.message);
  } finally {
    $('#lg-btn').disabled = false; $('#lg-btn').textContent = 'Log in';
  }
});
$('#logout').addEventListener('click', () => {
  try { sessionStorage.removeItem(SESSION); } catch {}
  creds = null; orders = []; clearInterval(timer);
  $('#app-view').classList.add('hidden'); $('#login-view').classList.remove('hidden');
  $('#lg-pass').value = '';
});
function enter() {
  $('#login-view').classList.add('hidden');
  $('#app-view').classList.remove('hidden');
  $('#order-link').textContent = new URL('order.html', location.href).href;
  load();
  clearInterval(timer);
  timer = setInterval(() => { if (!document.hidden) load(true); }, 60000);
}
async function load(quiet) {
  $('#refresh').classList.add('spinning');
  try {
    const j = await api({ action: 'list', ...creds });
    orders = j.orders.sort((a, b) => (a.date + String(C.slots.indexOf(a.slot)).padStart(2, '0')).localeCompare(b.date + String(C.slots.indexOf(b.slot)).padStart(2, '0')) || a.ref.localeCompare(b.ref));
    $('#sub').textContent = `Updated ${new Date().toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit', timeZone: IST })} · auto-refresh every minute`;
    render();
  } catch (err) {
    if (/password|username/i.test(err.message)) { $('#logout').click(); toast('Please log in again', 'bad'); return; }
    if (!quiet) toast(err.message, 'bad');
  } finally {
    $('#refresh').classList.remove('spinning');
  }
}
$('#refresh').addEventListener('click', () => load());

// ───────── Render ─────────
const live = (o) => o.status !== 'CANCELLED';
const inDate = (o) => view.date === 'ALL' || o.date === view.date;
function filtered() {
  const q = view.q.trim().toLowerCase();
  return orders.filter((o) => inDate(o) &&
    (view.status === 'ALL' || (view.status === 'ACTIVE' ? !['DELIVERED', 'CANCELLED'].includes(o.status) : o.status === view.status)) &&
    (!q || [o.ref, o.name, o.mobile].some((x) => String(x).toLowerCase().includes(q))));
}
function greeting() {
  const h = Number(new Intl.DateTimeFormat('en-IN', { hour: 'numeric', hour12: false, timeZone: IST }).format(new Date()));
  return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
}

function render() {
  const t = today();
  const sel = orders.filter(inDate).filter(live);
  const value = sel.reduce((a, o) => a + o.total, 0);
  const dz = sel.reduce((a, o) => a + o.items.filter((i) => i.unit === 'Dzn').reduce((s, i) => s + i.qty, 0), 0);
  const newCount = orders.filter((o) => o.status === 'NEW').length;
  const ready = orders.filter((o) => o.status === 'READY').length;
  const todayN = nightOf(t);
  const where = view.date === 'ALL' ? 'all nights' : (nightOf(view.date) ? (isDussehra(nightOf(view.date)) ? 'Dussehra' : `Night ${nightOf(view.date).i}`) + ' · ' + dLabel(view.date, { day: 'numeric', month: 'short' }) : dLabel(view.date));

  $('#hello').innerHTML = `
    <div class="gu">${greeting()} · ${todayN ? (isDussehra(todayN) ? 'Happy Dussehra 🏹' : `Night ${todayN.i} of ${F.name} 💃`) : 'શુભ નવરાત્રી 🙏'}</div>
    <h1>Jai Mataji, Maharaj</h1>
    <div class="big"><b class="num">${rs(value)}</b><span>expected from ${sel.length} order${sel.length === 1 ? '' : 's'} · ${where}</span></div>
    <div class="badges">
      ${newCount ? `<span class="hb new"><i></i>${newCount} new to confirm</span>` : '<span class="hb">✓ All orders confirmed</span>'}
      ${ready ? `<span class="hb">🛍️ ${ready} ready for pickup</span>` : ''}
    </div>`;

  // Night circles
  const count = (d) => orders.filter((o) => o.date === d && live(o)).length;
  const extra = [...new Set(orders.map((o) => o.date))].filter((d) => d && !nightOf(d)).sort();
  $('#nights').innerHTML = `<button class="nt all ${view.date === 'ALL' ? 'on' : ''}" data-date="ALL"><span class="c"><b>All</b><span class="k">${orders.filter(live).length}</span></span><span class="l">All nights</span></button>` +
    NIGHTS.map((n) => {
      const c = NAV[(n.i - 1) % NAV.length], k = count(n.d);
      return `<button class="nt ${view.date === n.d ? 'on' : ''} ${n.d === t ? 'today' : ''}" data-date="${n.d}" style="--c:${c};--t:${inkOn(c)}">
        <span class="c"><small>${isDussehra(n) ? '🏹' : 'Day ' + n.i}</small><b>${dLabel(n.d, { day: 'numeric' })}</b>${k ? `<span class="k">${k}</span>` : ''}</span>
        <span class="l">${n.d === t ? 'Today' : dLabel(n.d, { weekday: 'short' })}</span></button>`;
    }).join('') +
    extra.map((d) => `<button class="nt ${view.date === d ? 'on' : ''}" data-date="${d}" style="--c:#6d0f33"><span class="c"><small>${dLabel(d, { month: 'short' })}</small><b>${dLabel(d, { day: 'numeric' })}</b><span class="k">${count(d)}</span></span><span class="l">Other</span></button>`).join('');

  // KPIs
  $('#kpis').innerHTML = `
    <div class="kpi hl"><span class="ic">🪔</span><p>Orders</p><b class="num">${sel.length}</b><small>${where}</small></div>
    <div class="kpi"><span class="ic">💰</span><p>Expected</p><b class="num">${rs(value)}</b><small>estimated value</small></div>
    <div class="kpi"><span class="ic">🥟</span><p>Samosa dozens</p><b class="num">${q3(dz)}</b><small>to prepare</small></div>
    <div class="kpi"><span class="ic">🔔</span><p>To confirm</p><b class="num" style="color:var(--blue)">${newCount}</b><small>new orders</small></div>`;

  // Orders by night (one series, so one colour; selected night highlighted)
  const perNight = NIGHTS.map((n) => ({ n, k: count(n.d) }));
  const max = Math.max(1, ...perNight.map((p) => p.k));
  $('#chart').innerHTML = `<div class="hd"><b>Orders by night</b><span>${orders.filter(live).length} total</span></div>
    <div class="bars">${perNight.map(({ n, k }) => `<button class="${view.date === n.d ? 'on' : ''}" data-date="${n.d}" aria-label="${isDussehra(n) ? 'Dussehra' : 'Night ' + n.i}: ${k} orders"><em>${k || ''}</em><i style="height:${(k / max) * 82}px"></i></button>`).join('')}</div>
    <div class="bars-x">${perNight.map(({ n }) => `<span>${isDussehra(n) ? '🏹' : n.i}</span>`).join('')}</div>`;

  // Status chips
  const sc = (s) => orders.filter((o) => inDate(o) && (s === 'ALL' ? true : s === 'ACTIVE' ? !['DELIVERED', 'CANCELLED'].includes(o.status) : o.status === s)).length;
  $('#status-chips').innerHTML = [['ACTIVE', 'To do', 'var(--pink)'], ['ALL', 'All', 'var(--ink-3)'], ...STATUSES.map((s) => [s, s[0] + s.slice(1).toLowerCase(), DOT[s]])]
    .map(([k, l, c]) => `<button class="chip ${view.status === k ? 'on' : ''}" data-status="${k}" style="--dot:${c}"><i></i>${l} <span class="n">${sc(k)}</span></button>`).join('');

  if (view.tab === 'orders') renderOrders(); else renderPrep();
}

const ICON = {
  wa: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm4.5 12.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.4-.2Z"/></svg>',
  call: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2Z"/></svg>',
  bill: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8H8M16 12H8"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
};

function renderOrders() {
  const list = filtered();
  $('#orders').innerHTML = list.length ? list.map((o) => {
    const n = nightOf(o.date), c = colorOf(o.date);
    const wa = o.whatsapp || o.mobile;
    const msg = `Namaste ${o.name} 🙏\nYour Navratri order *${o.ref}* with ${C.businessName} is confirmed for ${dLabel(o.date)}, ${o.slot}.\nEstimated total: ${rs(o.total)}\n\nShubh Navratri! 🪔`;
    const idx = FLOW.indexOf(o.status);
    const nx = NEXT[o.status];
    return `<article class="op ${o.status === 'CANCELLED' ? 'cancel' : ''}" data-ref="${esc(o.ref)}">
      <div class="stub" style="--c:${c};--t:${inkOn(c)}"><small>${n ? (isDussehra(n) ? 'Dussehra' : 'Night ' + n.i) : dLabel(o.date, { month: 'short' })}</small><b>${dLabel(o.date, { day: 'numeric' })}</b><span>${esc(o.slot.split('–')[0].trim())}</span></div>
      <div class="body">
        <div class="top">
          <div class="who"><b>${esc(o.name)}</b><span>${esc(o.ref)} · ${esc(o.mobile)}</span></div>
          <div style="text-align:right"><div class="amt num">${rs(o.total)}</div><span class="badge s-${esc(o.status)}">${esc(o.status)}</span></div>
        </div>
        <div class="tags"><span class="tag">⏰ ${esc(o.slot)}</span><span class="tag">${o.type === 'DELIVERY' ? '🛵 Delivery' : '🛍️ Pickup'}</span>${o.fry ? `<span class="tag">🔥 ${esc(o.fry)}</span>` : ''}${o.occasion ? `<span class="tag">🎉 ${esc(o.occasion)}</span>` : ''}</div>
        <div class="its">${o.items.map((i) => `<span><b>${q3(i.qty)} ${esc(i.unit)}</b> ${esc(i.name.replace(/ Samosa$/, ''))}</span>`).join('')}</div>
        ${o.address ? `<div class="addr">📍 ${esc(o.address)}</div>` : ''}
        ${o.notes ? `<div class="note">📝 ${esc(o.notes)}</div>` : ''}
        ${o.status === 'CANCELLED' ? '' : `<div class="flow">${FLOW.map((s, k) => `${k ? `<span class="ln ${k <= idx ? 'done' : ''}"></span>` : ''}<span class="dot ${k < idx || (k === idx && s === 'DELIVERED') ? 'done' : k === idx ? 'cur' : ''}"></span>`).join('')}</div>
        <div class="flow-l">${['New', 'Confirmed', 'Preparing', 'Ready', 'Done'].map((l, k) => `<span class="${k === idx ? 'on' : ''}">${l}</span>`).join('')}</div>`}
        <div class="acts no-print">
          ${nx ? `<button class="btn sm next" data-advance="${nx[0]}">${nx[1]}</button>` : `<span class="next" style="font-size:12.5px;color:var(--ink-2);font-weight:700">${o.status === 'DELIVERED' ? '🎉 Completed' : '✕ Cancelled'}</span>`}
          <a class="ib wa" href="https://wa.me/91${esc(wa)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener" aria-label="WhatsApp ${esc(o.name)}" title="WhatsApp">${ICON.wa}</a>
          <a class="ib" href="tel:+91${esc(o.mobile)}" aria-label="Call ${esc(o.name)}" title="Call">${ICON.call}</a>
          <a class="ib" href="index.html#lead/${encodeURIComponent(JSON.stringify(leadForBill(o)))}" target="_blank" rel="noopener" aria-label="Make bill" title="Make bill">${ICON.bill}</a>
          <span class="ib more-menu" title="Change status">${ICON.more}<select data-act="status" aria-label="Change status">${STATUSES.map((s) => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select></span>
        </div>
      </div>
    </article>`;
  }).join('') : `<div class="empty card"><span class="em">🪔</span><b>No orders here yet</b><br>Share your order link and they'll appear here.</div>`;
}

/** Hand the order to the billing page (index.html) to pre-fill a new bill */
function leadForBill(o) {
  return { ref: o.ref, name: o.name, phone: o.mobile, date: o.date, slot: o.slot, type: o.type, fry: o.fry, notes: [o.notes, o.address].filter(Boolean).join(' · '),
    items: o.items.map((i) => ({ name: i.name, unit: i.unit, qty: i.qty, price: i.price })) };
}

function prepRows(list) {
  const map = {};
  list.forEach((o) => o.items.forEach((i) => {
    const k = i.name + '|' + i.unit;
    const e = (map[k] ||= { name: i.name, unit: i.unit, total: 0, slots: {}, fry: {} });
    e.total += i.qty; e.slots[o.slot] = (e.slots[o.slot] || 0) + i.qty; e.fry[o.fry || '—'] = (e.fry[o.fry || '—'] || 0) + i.qty;
  }));
  const order = C.menu.map((m) => m.name);
  return Object.values(map).sort((a, b) => (order.indexOf(a.name) + 1 || 99) - (order.indexOf(b.name) + 1 || 99));
}
const FRYC = { 'Full Fry': '#e8491d', 'Half Fry': '#f6a400', 'Raw / Frozen': '#1e88e5', '—': '#ab9b8d' };
function renderPrep() {
  const list = orders.filter((o) => inDate(o) && live(o) && o.status !== 'DELIVERED');
  $('#prep-title').textContent = `🍳 Prep · ${view.date === 'ALL' ? 'all nights' : dLabel(view.date, { weekday: 'long', day: 'numeric', month: 'short' })}`;
  const rows = prepRows(list);
  if (!rows.length) { $('#prep').innerHTML = '<div class="empty card" style="margin-top:12px"><span class="em">🍳</span><b>Nothing to prepare</b><br>No open orders for this night.</div>'; return; }
  const slots = [...new Set(list.map((o) => o.slot))].sort((a, b) => C.slots.indexOf(a) - C.slots.indexOf(b));
  $('#prep').innerHTML = `
    <div class="prep-grid">${rows.map((r) => `<div class="pt">
      <div class="nm">${esc(r.name)}</div>
      <div class="q num">${q3(r.total)}<small>${esc(r.unit)}</small></div>
      <div class="fry">${Object.entries(r.fry).map(([f, q]) => `<i style="width:${(q / r.total) * 100}%;background:${FRYC[f] || '#ab9b8d'}"></i>`).join('')}</div>
      <div class="legend">${Object.entries(r.fry).map(([f, q]) => `<span style="color:${FRYC[f] || 'inherit'}">●</span> ${esc(f)} ${q3(q)}`).join(' &nbsp;')}</div>
    </div>`).join('')}</div>
    <div class="card slots"><div style="overflow-x:auto"><table class="st"><thead><tr><th>Time slot</th>${rows.map((r) => `<th class="r">${esc(r.name.replace(/^Navtad /, '').replace(/ Samosa$/, ''))}</th>`).join('')}<th class="r">Orders</th></tr></thead><tbody>
      ${slots.map((s) => `<tr><td><b>${esc(s)}</b></td>${rows.map((r) => `<td class="r">${r.slots[s] ? q3(r.slots[s]) : '·'}</td>`).join('')}<td class="r">${list.filter((o) => o.slot === s).length}</td></tr>`).join('')}
      <tr class="tot"><td>Total</td>${rows.map((r) => `<td class="r">${q3(r.total)}</td>`).join('')}<td class="r">${list.length}</td></tr>
    </tbody></table></div></div>`;
}

// ───────── Events ─────────
async function setStatus(ref, status) {
  const o = orders.find((x) => x.ref === ref);
  const prev = o.status;
  o.status = status; render();
  try { await api({ action: 'update', ...creds, ref, status }); toast(`${ref} → ${status}`, 'ok'); }
  catch (err) { o.status = prev; render(); toast(err.message, 'bad'); }
}
document.addEventListener('click', (e) => {
  const d = e.target.closest('[data-date]'); if (d && !d.closest('.op')) { view.date = d.dataset.date; render(); return; }
  const s = e.target.closest('[data-status]'); if (s) { view.status = s.dataset.status; render(); return; }
  const a = e.target.closest('[data-advance]'); if (a) { setStatus(a.closest('.op').dataset.ref, a.dataset.advance); return; }
  const t = e.target.closest('[data-tab]');
  if (t) {
    view.tab = t.dataset.tab;
    $$('.seg button').forEach((b) => b.classList.toggle('on', b === t));
    $('#orders-tab').classList.toggle('hidden', view.tab !== 'orders');
    $('#prep-tab').classList.toggle('hidden', view.tab !== 'prep');
    render();
  }
});
document.addEventListener('change', (e) => {
  if (e.target.dataset.act === 'status') setStatus(e.target.closest('.op').dataset.ref, e.target.value);
});
$('#search').addEventListener('input', (e) => { view.q = e.target.value; renderOrders(); });
$('#share-link').addEventListener('click', async () => {
  const url = $('#order-link').textContent;
  const text = `🪔 Navratri Special at ${C.businessName}!\nPre-order fresh samosas by the dozen for your garba nights and get your Navratri Pass.\nOrder here 👉 ${url}`;
  if (navigator.share) navigator.share({ title: 'Maharaj Navratri Pass', text }).catch(() => {});
  else { try { await navigator.clipboard.writeText(text); toast('Link copied', 'ok'); } catch { prompt('Copy this link', url); } }
});
$('#xls').addEventListener('click', () => {
  if (!window.XLSX) return toast('Excel tool still loading', 'bad');
  const list = filtered();
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(list.map((o) => ({
    Ref: o.ref, Status: o.status, Night: nightOf(o.date) ? (isDussehra(nightOf(o.date)) ? 'Dussehra' : 'Night ' + nightOf(o.date).i) : '', Date: o.date, 'Time slot': o.slot, Type: o.type,
    Name: o.name, Mobile: o.mobile, WhatsApp: o.whatsapp, Address: o.address, Items: o.items.map((i) => `${i.name} × ${q3(i.qty)} ${i.unit}`).join(', '),
    'Estimated total (₹)': o.total, Fry: o.fry, Occasion: o.occasion, Notes: o.notes, Created: o.created,
  })));
  ws['!cols'] = [10, 12, 10, 11, 18, 10, 20, 12, 12, 30, 50, 14, 12, 16, 30, 20].map((w) => ({ wch: w }));
  XLSX.utils.book_append_sheet(wb, ws, 'Orders');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(prepRows(list.filter(live)).map((r) => ({ Item: r.name, Unit: r.unit, Total: r.total }))), 'Kitchen prep');
  XLSX.writeFile(wb, `Maharaj-Navratri-Orders-${view.date === 'ALL' ? 'all' : view.date}.xlsx`);
});

// Stay logged in for this browser tab
try { const s = JSON.parse(sessionStorage.getItem(SESSION) || 'null'); if (s) { creds = s; enter(); } } catch {}
</script>
